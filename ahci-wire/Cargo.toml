[package]
name = "ahci-wire"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
# None on purpose: every register offset, bit, FIS field and PRDT entry
# is pure byte/bit arithmetic over data the caller supplies, so the whole
# crate is `no_std` + `forbid(unsafe_code)` and host-tested exactly the
# way the kernel runs it. The MMIO `unsafe` glue lives in
# `kernel/src/ahci.rs` (the project's `unsafe`-budget rule).
