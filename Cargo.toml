[workspace]
resolver = "2"
members = ["ahci-wire", "aiwire", "csscore", "dom", "editorbuf", "fat", "git-pack", "git-pktline", "git-store", "gptwire", "html", "kernel", "mbi", "net", "pci", "rtc", "sky2-wire", "ssh-wire", "usbwire", "user/hello", "xtask"]
# Bare `cargo build` at the repo root must not try to build `kernel` for the
# host: it is no_std and only valid for x86_64-unknown-none (built via xtask).
default-members = ["ahci-wire", "aiwire", "csscore", "dom", "editorbuf", "fat", "git-pack", "git-pktline", "git-store", "gptwire", "html", "mbi", "net", "pci", "rtc", "sky2-wire", "ssh-wire", "usbwire", "xtask"]

[workspace.package]
edition = "2024"
publish = false

# `x86_64-unknown-none` defaults to abort already; make it explicit for the
# userland ELF (no unwinding tables, no personality, no heap). Kernel
# `--release` builds are unaffected — it has its own panic handler too.
[profile.release]
panic = "abort"
