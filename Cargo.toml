[workspace]
resolver = "2"
members = ["aiwire", "csscore", "dom", "editorbuf", "fat", "git-pack", "git-pktline", "git-store", "html", "kernel", "mbi", "net", "pci", "rtc", "sky2-wire", "ssh-wire", "usbwire", "xtask"]
# Bare `cargo build` at the repo root must not try to build `kernel` for the
# host: it is no_std and only valid for x86_64-unknown-none (built via xtask).
default-members = ["aiwire", "csscore", "dom", "editorbuf", "fat", "git-pack", "git-pktline", "git-store", "html", "mbi", "net", "pci", "rtc", "sky2-wire", "ssh-wire", "usbwire", "xtask"]

[workspace.package]
edition = "2024"
publish = false
