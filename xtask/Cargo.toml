[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
# Host-side disk work, shared with the kernel through the same crates:
# `fat` formats `disk.img` (and verifies `target.img`'s volume after
# the VM ran) through the exact reader/writer the boot proofs use;
# `gptwire` parses the GPT the kernel wrote (installer I1's host-side
# independent check — docs/installer.md §7.3).
fat = { path = "../fat" }
gptwire = { path = "../gptwire" }
