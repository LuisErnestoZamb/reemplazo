[package]
name = "aiwire"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
# A3 of docs/ai-client.md §2 — the reviewed JSON adoptation:
# `serde_json`/`serde` are the de-facto standard, officially no_std +
# alloc ("No-std support: as long as there is a memory allocator",
# docs.rs/serde_json), RustSec-clean, MIT/Apache-2.0. `default-features =
# false` keeps std out of the kernel; `alloc` is our heap (landed in
# f82e61b), `derive` is the proc-macro side (host-side compile only).
# No other new external crate in this milestone; review recorded in the
# commit and `cargo audit` run at the gate.
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
