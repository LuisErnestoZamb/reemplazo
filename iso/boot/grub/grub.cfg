set timeout=0
set default=0

menuentry "reemplazo" {
    multiboot2 /boot/kernel.elf
    # I1b: the installer writes these two blobs to the target disk.
    # `grubpayload.bin` = GRUB i386-pc boot.img (first 512 B) followed by
    # core.img (the rest), built by xtask's `grub-mkimage` step; `payload`
    # is the running kernel's own ELF, installed as /KERNEL.ELF so an
    # offline install boots standalone.
    module2 /boot/grubpayload.bin grubpayload
    module2 /boot/kernel.elf payload
    boot
}
