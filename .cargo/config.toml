[alias]
xtask = "run -p xtask --"

# Hard constraint from AGENTS.md: the target CPU (Core2 Duo T7400) tops out at
# SSSE3. Never use target-cpu=native here — the build host is a different CPU.
# `x86-64` is the original x86-64 baseline: no SSE3+, well under the SSSE3
# ceiling.
#
# Note (verified with `rustc --print cfg --target x86_64-unknown-none`): this
# target's spec leaves SSE/SSE2 *disabled*, and target-cpu=x86-64 does not
# re-enable them — so kernel code is compiled without SSE. The crypto
# dependencies still build because their SIMD paths are `#[target_feature]`-
# gated behind runtime cpuid checks with soft fallbacks (never taken on the
# T7400 or QEMU's qemu64). Turning SSE2 on for the kernel proper also means
# saving/restoring XMM in the ISR stubs — that belongs to the userland
# milestone, where ABI-mandated SSE state must be switched anyway.
#
# relocation-model=static: the kernel is linked at a fixed physical address
# (linker.ld) and entry.S uses absolute addressing; the default PIC model
# emits R_X86_64_32 relocs rust-lld rejects for local symbols.
[target.x86_64-unknown-none]
rustflags = [
    "-C",
    "target-cpu=x86-64",
    "-C",
    "relocation-model=static",
    # The userland ELF lives at USER_BASE = 0x8000_0000_0000 (512 GiB),
    # far above the small code model's signed-32-bit absolute relocation
    # range. The large code model keeps the static relocation model
    # (link-time only, no dynamic relocs) but uses 64-bit absolute forms.
    # The kernel (linked at 2 MiB) builds unchanged with it.
    "-C",
    "code-model=large",
    # curve25519-dalek 5 (via x25519-dalek, S2 of docs/git-ssh-deps.md)
    # picks its field backend from the *architecture alone*
    # (build.rs: x86_64 + 64-bit → "simd"), and that "simd" backend is
    # AVX2 code (`__m256i`, `_mm256_*` intrinsics). On this target that
    # is doubly wrong: (1) a compile-time blowup — LLVM scalarizes the
    # 256-bit vectors against an SSE-less x86_64-unknown-none spec and
    # rustc burned >8 CPU-hours without finishing (verified 2026-11-21);
    # (2) a runtime SIGILL beyond the Core2 Duo's SSSE3 ceiling
    # (AGENTS.md) — the backend is NOT `#[target_feature]`-gated. The
    # build script reads this cfg as CARGO_CFG_CURVE25519_DALEK_BACKEND
    # and selects the portable `serial` (plain u64) backend instead —
    # same audited crate, correct on this CPU, compiles in seconds.
    "--cfg",
    "curve25519_dalek_backend=\"serial\"",
]
