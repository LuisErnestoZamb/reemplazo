[package]
name = "kernel"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
bootinfo = { path = "../bootinfo" }
net = { path = "../net" }
pci = { path = "../pci" }

# TLS stack (reviewed in the TLS milestone commit): `embedded-tls` is
# pinned by git rev for a reproducible Cargo.lock; its crypto comes from
# RustCrypto through `embassy-crypto` (same pinned embassy rev), and
# certificate path building from `rustls-webpki` (crates.io, no default
# features → no ring/aws-lc). No hand-rolled crypto.
# `p256` verifies the github.com leaf (P-256 key); `p384` verifies the
# Sectigo/USERTrust intermediates, which are signed ecdsa-with-SHA384
# over secp384r1 issuer keys.
embedded-tls = { git = "https://github.com/embassy-rs/embedded-tls", rev = "63c59a1f5dbc4605a85553dac015526f8f88ff4d", default-features = false, features = ["webpki", "p256", "p384", "log"] }
log = { version = "0.4", default-features = false }
embassy-crypto = { git = "https://github.com/embassy-rs/embassy", rev = "822a76ea91f2c0885c6eb0c65fe91181e31133e1" }
embassy-crypto-rustcrypto = { git = "https://github.com/embassy-rs/embassy", rev = "822a76ea91f2c0885c6eb0c65fe91181e31133e1", features = [
    "embassy-crypto-sha256",
    "embassy-crypto-sha384",
    "embassy-crypto-hmac-sha256",
    "embassy-crypto-aes128-gcm",
    "embassy-crypto-p256-ecdh",
    "embassy-crypto-p256-ecdsa",
    "embassy-crypto-p384-ecdsa",
] }
embedded-io = { version = "0.7", default-features = false }
rand_chacha = { version = "0.9", default-features = false }
rand_core = { version = "0.9", default-features = false }
