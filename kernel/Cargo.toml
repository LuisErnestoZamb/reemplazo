[package]
name = "kernel"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
mbi = { path = "../mbi" }
# pkt-line codec + upload-pack advertisement parser (G1 of
# docs/git-ssh-deps.md): from-scratch under dependency-policy
# exception (a) — `gix-packetline` is std-only; rationale and the
# adversarial test suite live in the crate's docs.
git-pktline = { path = "../git-pktline" }
# SSH wire codec (S1/S2 of docs/git-ssh-deps.md §B): from-scratch
# under dependency-policy exception (a) — `russh` is std-only with an
# advisory history, `ssh-protocol` is a WIP facade; rationale and the
# adversarial test suite live in the crate's docs.
ssh-wire = { path = "../ssh-wire" }
# SSH key exchange (S2, docs/git-ssh-deps.md §B.1): audited dalek
# crates for X25519/Ed25519, `default-features = false` (no getrandom,
# no serde, no alloc — `static_secrets` only). Review recorded in the
# S2 commit: x25519-dalek 3.0.0 + ed25519-dalek 3.0.0 are RustSec-clean
# at these versions (RUSTSEC-2024-0344/2022-0093 patched long before),
# `#![no_std]` by construction, and both cross-check clean for
# `x86_64-unknown-none`.
x25519-dalek = { version = "3.0", default-features = false, features = ["static_secrets"] }
ed25519-dalek = { version = "3.0", default-features = false }
# SSH transport crypto glue (S2): SHA-256 (exchange hash + RFC4253 §7.2
# KDF), HMAC-SHA256 (packet MACs), AES-CTR (aes128/256-ctr). All four
# already in Cargo.lock via embassy-crypto-rustcrypto / aes-gcm, audited
# (RustSec-clean at these versions), no_std with `default-features =
# false` (no alloc). The protocol glue lives in `ssh-wire`, tested on
# the host against these same crates.
sha2 = { version = "0.11", default-features = false }
hmac = { version = "0.13", default-features = false }
aes = { version = "0.9", default-features = false }
ctr = { version = "0.10", default-features = false }
multiboot2 = { version = "0.28", default-features = false }
net = { path = "../net" }
pci = { path = "../pci" }
rtc = { path = "../rtc" }
# COM1 register I/O (polled TX/RX): default features are empty — no
# nightly, no alloc; only `bitflags` beyond it.
uart_16550 = "0.9"

# Kernel heap (reviewed in docs/dependencies.md §4): `default-features =
# false` drops `use_spin` (which would pull spinning_top → lock_api →
# scopeguard) — we wrap the plain `Heap` in our own IRQ-aware lock
# instead (kernel/src/heap.rs). RUSTSEC-2022-0063 (out-of-bounds write
# on tiny/unaligned heaps) is patched in >= 0.10.2; 0.10.6 is clean.
linked_list_allocator = { version = "0.10.6", default-features = false }

# PS/2 scancode decoding (keyboard milestone): no_std, zero runtime
# dependencies, MIT OR Apache-2.0, RustSec-clean — evaluation and build
# probe in docs/pc-keyboard-eval.md. Handles set-1 make/break, E0/E1
# prefixes and Shift/CapsLock; the i8042 port layer is ours (keyboard.rs).
pc-keyboard = "0.9.0"

# TLS stack (reviewed in the TLS milestone commit): `embedded-tls` is
# pinned by git rev for a reproducible Cargo.lock; its crypto comes from
# RustCrypto through `embassy-crypto` (same pinned embassy rev), and
# certificate path building from `rustls-webpki` (crates.io, no default
# features → no ring/aws-lc). No hand-rolled crypto.
# `p256` verifies the github.com leaf (P-256 key); `p384` verifies the
# Sectigo/USERTrust intermediates, which are signed ecdsa-with-SHA384
# over secp384r1 issuer keys.
embedded-tls = { git = "https://github.com/embassy-rs/embedded-tls", rev = "63c59a1f5dbc4605a85553dac015526f8f88ff4d", default-features = false, features = ["webpki", "p256", "p384", "log"] }
log = { version = "0.4", default-features = false }
embassy-crypto = { git = "https://github.com/embassy-rs/embassy", rev = "822a76ea91f2c0885c6eb0c65fe91181e31133e1" }
embassy-crypto-rustcrypto = { git = "https://github.com/embassy-rs/embassy", rev = "822a76ea91f2c0885c6eb0c65fe91181e31133e1", features = [
    "embassy-crypto-sha256",
    "embassy-crypto-sha384",
    "embassy-crypto-hmac-sha256",
    "embassy-crypto-aes128-gcm",
    "embassy-crypto-p256-ecdh",
    "embassy-crypto-p256-ecdsa",
    "embassy-crypto-p384-ecdsa",
] }
embedded-io = { version = "0.7", default-features = false }
rand_chacha = { version = "0.9", default-features = false }
rand_core = { version = "0.9", default-features = false }

# TCP/IP stack (evaluated in docs/smoltcp-eval.md: ADOPT with
# conditions — 0BSD, zero RustSec advisories, no_std/no-alloc verified
# for x86_64-unknown-none, and a disassembly sweep of its 147812
# instructions found 0 AVX/SSE4/SSSE3/popcnt, safe on the Core2).
# Feature set is the doc's §1.2 minimum: Ethernet+ARP, IPv4, DHCP,
# DNS, TCP (+ Reno congestion control — cubic is f64-based), ICMP
# echo. Deliberately off: std/alloc, IPv6, UDP socket (DHCP/DNS emit
# their own UDP), fragmentation, raw/mdns sockets.
smoltcp = { version = "0.14", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "proto-dhcpv4",
    "proto-dns",
    "socket-tcp",
    "socket-tcp-reno",
    "socket-dhcpv4",
    "socket-dns",
    "socket-icmp",
    "log",
] }
