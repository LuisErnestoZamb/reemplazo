[package]
name = "ssh-wire"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# The shipped crate stays zero-dependency (no_std, forbid(unsafe_code),
# no allocator). These are **test-only**: the S2 host tests exercise the
# encrypted-phase glue (seal_packet / EncryptedRx / the RFC4253 §7.2
# KDF) against the same audited primitives the kernel uses (aes, ctr,
# hmac, sha2 — all already in Cargo.lock), so the roundtrip runs with
# real AES-CTR + HMAC-SHA256 at a fixed key/IV. The kernel build never
# sees them: dev-dependencies are ignored when another crate depends on
# this one.
[dev-dependencies]
aes = { version = "0.9", default-features = false }
ctr = { version = "0.10", default-features = false }
hmac = { version = "0.13", default-features = false }
sha2 = { version = "0.11", default-features = false }
