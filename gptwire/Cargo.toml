[package]
name = "gptwire"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
# None on purpose: GPT parsing/writing is pure byte arithmetic over a
# `Device` the caller supplies (no_std, `forbid(unsafe_code)`), so it is
# host-tested in `tests/hostile.rs` exactly the way the kernel runs it.
# From-scratch under dependency-policy exception (a) — see the crate docs
# and docs/installer.md §2(3)/§3.2 ("the OS partitions itself … it is
# the only option"; the CRC32 is the documented ~20-line table-driven
# glue we do not have anywhere else in the tree).
